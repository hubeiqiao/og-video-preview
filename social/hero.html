<!doctype html>
<!-- Repo hero and GitHub social preview, 1280x640. A poster: the eval's real cards fill the whole canvas
     as a dim, swaying wall; one of them lifts out inside a link-preview bubble and plays; one line of type
     across the bottom. render(t) seeks the playing video and moves the wall, so frames are deterministic. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400..700&family=Fragment+Mono&display=block" rel="stylesheet">
<script>window.OG = { width: 1280, height: 640 };</script>
<style>
:root {
  --ink: oklch(0.145 0.006 60); --text: oklch(0.97 0.004 60); --text-2: oklch(0.82 0.008 60); --text-3: oklch(0.72 0.01 60);
  --amber: oklch(0.82 0.15 78); --bubble: oklch(0.24 0.006 260);
  --shadow: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.28), 0 40px 100px oklch(0 0 0 / 0.45);
}
* { margin:0; box-sizing:border-box; }
html,body { width:1280px; height:640px; overflow:hidden; background:var(--ink); }
body { font-family:'Familjen Grotesk', sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; font-synthesis:none; text-rendering:geometricPrecision; position:relative; }
/* the wall: every eval card as a still, tilted and dimmed */
#wall { position:absolute; left:-260px; top:-170px; display:grid; grid-template-columns:repeat(9, 236px); gap:12px;
  transform:perspective(1800px) rotateX(18deg) rotateZ(-8deg); transform-origin:50% 50%; filter:brightness(0.5) saturate(0.9); }
#wall img { width:236px; height:124px; border-radius:8px; display:block; outline:1px solid oklch(1 0 0 / 0.1); outline-offset:-1px; }
.scrim { position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, oklch(0.145 0.006 60 / 0.55) 0%, oklch(0.145 0.006 60 / 0) 22%, oklch(0.145 0.006 60 / 0) 46%, oklch(0.145 0.006 60 / 0.92) 78%, var(--ink) 100%); }
/* the one that plays, in a link-preview bubble; 22 px outer radius around an 8 px-padded card would be 30, the card itself is flush */
#bubble { position:absolute; left:676px; top:70px; width:500px; border-radius:22px; overflow:hidden; background:var(--bubble);
  box-shadow:var(--shadow), 0 0 0 1px oklch(1 0 0 / 0.1); transform:rotate(-3deg); }
#bubble video { width:500px; height:263px; display:block; }
#bubble .cap { padding:12px 18px 14px; font-size:16px; color:var(--text-3); }
#live { position:absolute; left:700px; top:40px; display:flex; align-items:center; gap:8px; font-family:'Fragment Mono', monospace; font-size:14px;
  color:var(--amber); transform:rotate(-3deg); transform-origin:0 50%; }
#live i { width:9px; height:9px; border-radius:50%; background:oklch(0.66 0.21 28); }
/* type: one line, big, bottom-left; small labels in two corners */
#title { position:absolute; left:56px; bottom:50px; width:760px; font-size:92px; font-weight:700; line-height:0.95; letter-spacing:-0.035em; text-wrap:balance; }
#title span { color:var(--amber); }
.label { position:absolute; font-family:'Fragment Mono', monospace; font-size:15px; color:var(--text-2); }
#name { left:56px; top:40px; }
#name b { color:var(--text); font-weight:400; }
#facts { right:56px; bottom:58px; text-align:right; line-height:1.65; color:var(--text-3); }
#facts em { font-style:normal; color:var(--text); }
</style></head>
<body>
<div id="wall"></div>
<div class="scrim"></div>
<div id="live"><i></i>og:video · playing</div>
<div id="bubble"><video id="play" muted playsinline preload="auto" src="../eval/out/stripe.mp4"></video><div class="cap">stripe.com</div></div>
<div class="label" id="name"><b>og-video-preview</b> · agent skill</div>
<div id="title">Make your link previews <span>move.</span></div>
<div class="label" id="facts"><em>103</em> real OG images tested<br>frame 0 = your image<br>plays in iMessage and Discord</div>
<script>
const names = ['a16z','accel','amd','anthropic','apple','arc','astro','bolt','bun','bvp','cal','calendly','canva','clerk','cloudflare',
  'coatue','cognition','cohere','conviction','cursor','deno','discord','dropbox','dub','duolingo','elevenlabs','excalidraw','figma','fly',
  'framer','generalcatalyst','ghost','github','glean','granola','greylock','groq','gumroad','gv','harvey','huggingface','ibm','ideogram',
  'indexventures','insightpartners','intercom','kleinerperkins','linear','loom','lovable','lsvp','mailchimp','mintlify','miro','mistral',
  'mobbin','netlify','nextjs','nfx','notion','obsidian','openai','perplexity','pika','pinterest','pitch','planetscale','posthog','railway',
  'raycast','replit','resend','retool','rive','runwayml','salesforce','scale','sentry','sequoiacap','shopify','slack','spline','spotify',
  'stability','stripe','suno','supabase','superhuman','tailwindcss','thrivecap','tldraw','together','typeform','v0','vercel','vite','warp',
  'webflow','windsurf','x','ycombinator','zapier','zed'];
const wall = document.getElementById('wall'), play = document.getElementById('play'), dot = document.querySelector('#live i');
const imgs = Array.from({ length: 81 }, (_, k) => {
  const im = new Image(); im.src = `../eval/out/${names[(k * 23) % names.length]}.jpg`; wall.appendChild(im); return im;
});
const loaded = el => new Promise(r => (el.tagName === 'VIDEO' ? el.readyState >= 2 : el.complete) ? r()
  : el.addEventListener(el.tagName === 'VIDEO' ? 'loadeddata' : 'load', r, { once: true }));
window.render = async function (t) {
  wall.style.translate = `${(-28 * Math.sin(2 * Math.PI * t / 4)).toFixed(2)}px 0`; // a slow sway that closes the loop
  dot.style.opacity = 0.55 + 0.45 * Math.cos(2 * Math.PI * t / 2);
  await new Promise(r => {
    const target = t % 4;
    if (Math.abs(play.currentTime - target) < 1e-3) return r();
    play.addEventListener('seeked', () => r(), { once: true });
    play.currentTime = target;
  });
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
};
window.ready = Promise.all([document.fonts.ready, loaded(play), ...imgs.map(loaded)]).then(() => window.render(0)).then(() => { window.readyDone = true; });
</script>
</body></html>
