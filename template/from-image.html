<!doctype html>
<!--
  Turns an approved, finished OG image into a looping animation.

  Every layer is cut from the approved image itself (layers.png: the card with alpha
  around each element) and sits exactly where it was, over a clean plate (plate.png),
  so frame 0 is the approved card, pixel for pixel, and the loop closes on it.

  Motion is chosen per element from its `kind` (written by scripts/suggest_layers.py):
  each kind has an entrance, an exit, an idle motion and an accent, all built on the
  house motion tokens below. layers.js may override per layer: kind, motion, at, idle,
  fx, turn; and per card: fx (the accents its kinds share), accent (a colour), texture.

  style   rebuild  quick staggered exit, then every element re-enters (default when there is text)
          living   nothing leaves; elements move in place (default for image-only cards)
  energy  calm | lively | bold   distance, overshoot and how many accents

  Capture with scripts/render_frames.py. Open with ?play to preview in a browser.
-->
<html><head><meta charset="utf-8">
<script src="layers.js"></script>
<script src="cuts/cuts.js"></script>
<style>
* { margin:0; box-sizing:border-box; }
html, body { overflow:hidden; background:#000; }
#stage, #cam { position:relative; overflow:hidden; }
#cam { transform-origin:50% 50%; }
#plate, .abs { position:absolute; left:0; top:0; }
.mask { position:absolute; overflow:hidden; }
.part, .el { position:absolute; background-repeat:no-repeat; will-change:transform, opacity, filter; }
.sheen { position:absolute; pointer-events:none; opacity:0; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
.ring { position:absolute; border-radius:50%; opacity:0; }
.glow { position:absolute; border-radius:50%; opacity:0; mix-blend-mode:screen; }
.spark { position:absolute; width:18px; height:18px; margin:-9px 0 0 -9px; opacity:0;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%); }
#flare { position:absolute; top:-20%; height:140%; width:46%; opacity:0; mix-blend-mode:screen; }
</style></head>
<body>
<div id="stage"><div id="cam"><canvas id="plate"></canvas><div id="fx" class="abs"></div><div id="root" class="abs"></div><div id="top" class="abs"><div id="flare"></div></div></div></div>
<svg width="0" height="0" style="position:absolute"><defs id="defs"></defs></svg>
<script>
const C = window.OG, W = C.width, H = C.height, T = C.loop || 4;
const $ = id => document.getElementById(id);
for (const el of [document.documentElement, document.body, $('stage'), $('cam'), $('fx'), $('root'), $('top')]) {
  el.style.width = W + 'px'; el.style.height = H + 'px';
}

// ---- house motion tokens (physical-motion-design) ----
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { const v = X(t); if (Math.abs(v - x) < 1e-6) break; if (v < x) lo = t; else hi = t; t = (lo + hi) / 2; }
    return Y(t);
  };
}
const EASE = {
  smooth: bezier(0.22, 1, 0.36, 1),   // default for almost everything
  out:    bezier(0.17, 1, 0.32, 1),   // decorative entrances
  spring: bezier(0.35, 1.55, 0.65, 1),// pops, with overshoot
  inOut:  bezier(0.66, 0, 0.34, 1),   // symmetric moves
};
const away = x => 1 - EASE.smooth(1 - x);  // exits: the smooth curve reversed, accelerating away
const clamp = x => Math.max(0, Math.min(1, x));
const P = (t, a, d) => clamp((t - a) / d);
const bump = (t, a, d) => { const x = P(t, a, d); return x > 0 && x < 1 ? Math.sin(Math.PI * x) : 0; };
// a damped spring from 0 to 1: z = damping ratio, f = natural frequency in Hz
function spring(t, z, f) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const ENERGY = {
  calm:   { dist: 0.6,  z: 0.92, f: 2.0, gap: 0.085, accents: 0, idle: 0.6 },
  lively: { dist: 1.0,  z: 0.70, f: 2.4, gap: 0.065, accents: 1, idle: 1.0 },
  bold:   { dist: 1.35, z: 0.56, f: 2.7, gap: 0.055, accents: 2, idle: 1.4 },
}[C.energy || 'lively'];
const env = t => Math.sin(Math.PI * t / T) ** 2;          // 0 at both ends of the loop
const wave = (t, k = 1, ph = 0) => Math.sin(2 * Math.PI * k * t / T + ph) - Math.sin(ph); // periodic, 0 at t = 0

const TEXT = new Set(['headline', 'text', 'label']);
const CUT_REACH = 30;  // how far make_plate.py's cut can reach past a box (dilation plus soft shadow)
const VISUAL = new Set(['photo', 'panel', 'illustration', 'avatar']);
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return `${n >> 16 & 255},${n >> 8 & 255},${n & 255}`; };
const ACCENT = C.accent || (C.layers.find(l => l.tone) ? hexRgb(C.layers.find(l => l.tone).tone) : null);
const lum = h => hexRgb(h).split(',').reduce((m, v) => m + +v, 0) / 3;
const DARK = lum(C.paper || '#000000') < 110;  // a dark card: light accents read; on a light card they need colour or ink

// ---- accents: not one light sweep everywhere. Each card gets its own mix, chosen from the card itself (the same
// card always gets the same video); every element of a kind shares its card's choice, so the card stays coherent.
// layers.js may set fx per card ({"headline": "hop", "mark": "flip", "pill": "orbit"}) or per layer (fx, turn).
const SEED = C.layers.reduce((a, l) => (a * 31 + l.box[0] * 7 + l.box[1] * 13 + l.box[2] * 3 + l.box[3]) % 1000003, 17);
const pick = (list, salt) => { const v = Math.sin(SEED * 0.0137 + salt * 91.7) * 43758.5453; return list[Math.floor((v - Math.floor(v)) * list.length)]; };
const FX = {
  headline: (C.fx || {}).headline || pick(['sheen', 'hop'], 1),  // light through the letters, or letters hopping in turn (a star added beside type collided with it)
  mark: (C.fx || {}).mark || pick(['spin', 'flip', 'wobble', 'pop'], 2),  // how a logo or icon turns once: flat, in 3D, a swing, a pop
  pill: (C.fx || {}).pill || pick(['sheen', 'orbit'], 3),                 // a sweep, or a light circling it
};

// ---- build ----
let layers = [], extras = [], FOCAL = [W / 2, H / 2], WALL = null, SPARSE = false, LIST = null;
// a busy machine can drop a request: try each image three times before giving up
const load = (src, tries = 3) => new Promise((ok, no) => {
  const i = new Image();
  i.onload = () => i.decode().then(() => ok(i), () => ok(i));
  i.onerror = () => tries > 1 ? setTimeout(() => load(src + (src.includes('?') ? '&' : '?') + 'r=' + tries, tries - 1).then(ok, no), 200) : no(new Error('could not load ' + src));
  i.src = src;
});
const keep = [];  // decoded images stay referenced for the whole capture
// every image a frame can show is loaded and decoded before the first frame is captured
const images = [C.plate.src, C.layerImage, C.glyphs, C.sphere || (C.regions || []).some(r => r.role === 'orbit' || r.role === 'marquee' || r.role === 'slide') ? C.image : null, ...(C.cuts && window.CUTS ? C.layers.filter(l => window.CUTS[l.id]).map(l => `${C.cuts}${l.id}.png`) : []),
  ...(C.cuts && window.CUTS ? C.layers.filter(l => window.CUTS[l.id + '-ink']).map(l => `${C.cuts}${l.id}-ink.png`) : [])].filter(Boolean);
window.ready = Promise.all(images.map(s => load(s))).then(imgs => { keep.push(...imgs); return imgs; }).then(([pl, , , card]) => {
  const plate = $('plate'); plate.width = W; plate.height = H; plate.getContext('2d').drawImage(pl, 0, 0, W, H);
  build();
  if (C.texture || C.sphere || (WALL && DARK) || (C.regions || []).some(r => r.role === 'orbit' || r.role === 'marquee' || r.role === 'slide')) textureSetup(plate, C.sphere || (C.regions || []).some(r => r.role === 'orbit' || r.role === 'marquee' || r.role === 'slide') ? card : null);  // the card is in the list only with a sphere
  window.render(0); window.readyDone = true;
});

// ---- texture: a fine pattern in the background (suggest_layers.py "texture") moves as one surface, warped in place,
// calm right behind the type. The warp is scaled by env(t), so frame 0 and the end of the loop are the plate itself.
let TEX = null;
function textureSetup(canvas, card) {
  const ctx = canvas.getContext('2d'), src = ctx.getImageData(0, 0, W, H);
  // a turning globe samples the card itself: the plate's refills (an element's hole reaching over its limb) must not turn into view
  let whole = null;
  if (card) { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'); x.drawImage(card, 0, 0, W, H); whole = x.getImageData(0, 0, W, H); }
  const head = layers.filter(l => TEXT.has(l.kind)), f = FOCAL;
  // how far from the type the pattern may move: 0 inside the type's own area, 1 well clear of it
  const calm = new Float32Array(W * H);
  const boxes = head.map(l => [l.x - 24, l.y - 24, l.x + l.w + 24, l.y + l.h + 24])
    .concat((C.still || []).map(([x, y, w, h]) => [x - 16, y - 16, x + w + 16, y + h + 16]));  // solid things in the plate hold still too
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let d = 1e9;
    for (const [a, b, c, e] of boxes) d = Math.min(d, Math.hypot(Math.max(a - x, 0, x - c), Math.max(b - y, 0, y - e)));
    const u = clamp(d / 140); calm[y * W + x] = boxes.length ? u * u * (3 - 2 * u) : 1;
  }
  TEX = { ctx, src, whole, out: ctx.createImageData(W, H), calm, fx: f[0], fy: f[1], form: (C.fx || {}).texture || pick(['ripple', 'wind', 'swirl'], 4) };
}
function textureFrame(t) {
  if (C.sphere) return sphereFrame(t);
  if ((C.regions || []).some(r => r.role === 'orbit' || r.role === 'marquee' || r.role === 'slide')) return regionFrame(t);
  if (!C.texture) return wallFrame(t);
  const { ctx, src, out, calm, fx, fy, form } = TEX, A = 7 * ENERGY.idle * env(t);
  if (A < 0.02) { ctx.putImageData(src, 0, 0); return; }  // at rest: the plate exactly
  const s = src.data, o = out.data, ph = 2 * Math.PI * t / T, lam = 120;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, k = A * calm[i];
    let sx = x, sy = y;
    if (k > 0.01) {
      const dx = x - fx, dy = y - fy, r = Math.hypot(dx, dy) || 1;
      if (form === 'ripple') { const d = k * Math.sin(2 * Math.PI * r / lam - 2 * ph); sx -= d * dx / r; sy -= d * dy / r; }  // rings travel outward
      else if (form === 'wind') { sy -= k * Math.sin(2 * Math.PI * x / (lam * 2.2) - 2 * ph); sx -= 0.35 * k * Math.sin(2 * Math.PI * y / (lam * 1.6) + ph); }
      else { const a = k * 0.0045 * Math.exp(-r / 520), c = Math.cos(a), n = Math.sin(a); sx = fx + dx * c - dy * n; sy = fy + dx * n + dy * c; }
    }
    // bilinear sample, clamped to the card
    const x0 = Math.max(0, Math.min(W - 2, Math.floor(sx))), y0 = Math.max(0, Math.min(H - 2, Math.floor(sy)));
    const ax = Math.max(0, Math.min(1, sx - x0)), ay = Math.max(0, Math.min(1, sy - y0));
    const p00 = (y0 * W + x0) * 4, p10 = p00 + 4, p01 = p00 + W * 4, p11 = p01 + 4, q = i * 4;
    for (let c = 0; c < 3; c++)
      o[q + c] = (s[p00 + c] * (1 - ax) + s[p10 + c] * ax) * (1 - ay) + (s[p01 + c] * (1 - ax) + s[p11 + c] * ax) * ay;
    o[q + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}
// a band of light crosses the logo wall once, brightening only what is lighter than the card (the logos), plate included
function wallFrame(t) {
  const { ctx, src, out } = TEX, q = P(t, 0.85, 1.6);
  if (q <= 0 || q >= 1) { ctx.putImageData(src, 0, 0); return; }
  const s = src.data, o = out.data, [x0, y0, x1, y1] = WALL.map(Math.round), paper = lum(C.paper || '#000000');
  const pos = x0 - 260 + (x1 - x0 + 520) * EASE.inOut(q), sig = 80, amp = 0.55 * Math.sin(Math.PI * q);
  o.set(s);
  for (let y = Math.max(0, y0); y < Math.min(H, y1); y++) for (let x = Math.max(0, x0); x < Math.min(W, x1); x++) {
    const d = x + 0.35 * (y - y0) - pos;
    if (Math.abs(d) > 3 * sig) continue;
    const i = (y * W + x) * 4, k = clamp(((s[i] + s[i + 1] + s[i + 2]) / 3 - paper - 8) / 60);
    if (k <= 0) continue;
    const b = amp * Math.exp(-d * d / (2 * sig * sig)) * k;
    for (let c = 0; c < 3; c++) o[i + c] = s[i + c] + (255 - s[i + c]) * b;
  }
  ctx.putImageData(out, 0, 0);
}
// regions of the card the reading names (suggest_layers.py --scene), moved as parts of the card itself, sampled from
// the card (so nothing a refill made can turn into view), each zero at t = 0 and t = loop:
//   orbit    everything outside an inner radius (avatars around a mark) turns about the centre and back, most near
//            the ring, less toward the corners; inside, the mark stays put
//   marquee  a row of logos running off the card slides sideways and back, wrapping round inside its band
function regionFrame(t) {
  const { ctx, src, whole, out } = TEX, s = whole.data, o = out.data, w2 = 2 * Math.PI * t / T;
  o.set(src.data);
  const sample = (q, sx, sy) => {
    sx = Math.max(0, Math.min(W - 1.001, sx)); sy = Math.max(0, Math.min(H - 1.001, sy));
    const x0 = Math.floor(sx), y0 = Math.floor(sy), ax = sx - x0, ay = sy - y0, p = (y0 * W + x0) * 4;
    for (let c = 0; c < 3; c++) o[q + c] = (s[p + c] * (1 - ax) + s[p + 4 + c] * ax) * (1 - ay) + (s[p + W * 4 + c] * (1 - ax) + s[p + W * 4 + 4 + c] * ax) * ay;
  };
  for (const R of C.regions) {
    const [bx, by, bw, bh] = R.box.map(Math.round);
    if (R.role === 'orbit' && R.sats) {
      // each satellite moves whole along its circle and stays upright: erased where it was, drawn where it is
      const [cx, cy] = R.center || [bx + bw / 2, by + bh / 2], r0 = R.inner || 0, r1 = R.outer || Math.hypot(W, H) / 2;
      const th = (R.deg || 22) * Math.PI / 180 * ENERGY.idle * Math.sin(w2) * (R.dir || 1);
      if (Math.abs(th) < 1e-5) continue;
      R._bg = R._bg || R.sats.map(([x, y, w, h]) => {  // each one's background: the median of its frame
        const ring = [];
        for (let i = 0; i < w; i++) for (const yy of [y, y + h - 1]) { const p = (Math.min(H - 1, Math.max(0, yy)) * W + Math.min(W - 1, Math.max(0, x + i))) * 4; ring.push([s[p], s[p + 1], s[p + 2]]); }
        for (let j = 0; j < h; j++) for (const xx of [x, x + w - 1]) { const p = (Math.min(H - 1, Math.max(0, y + j)) * W + Math.min(W - 1, Math.max(0, xx))) * 4; ring.push([s[p], s[p + 1], s[p + 2]]); }
        return [0, 1, 2].map(c => ring.map(v => v[c]).sort((a, b) => a - b)[ring.length >> 1]);
      });
      const inDisc = (x, y, X, Y, w, h) => ((x - X - w / 2) / (w / 2)) ** 2 + ((y - Y - h / 2) / (h / 2)) ** 2 <= 1;
      R.sats.forEach(([X, Y, w, h], k) => {
        for (let y = Math.max(0, Y); y < Math.min(H, Y + h); y++) for (let x = Math.max(0, X); x < Math.min(W, X + w); x++)
          if (inDisc(x, y, X, Y, w, h)) { const q = (y * W + x) * 4; for (let c = 0; c < 3; c++) o[q + c] = R._bg[k][c]; }
      });
      R.sats.forEach(([X, Y, w, h]) => {
        const mx = X + w / 2, my = Y + h / 2, dx = mx - cx, dy = my - cy, r = Math.hypot(dx, dy);
        // all of them turn by one angle: a rigid turn keeps every distance, so none runs into another (one that turns
        // past the card's edge is clipped by it)
        const a = -th;
        const nx = cx + dx * Math.cos(a) - dy * Math.sin(a), ny = cy + dx * Math.sin(a) + dy * Math.cos(a);
        const ox = nx - mx, oy = ny - my;
        for (let y = Math.floor(Y + oy); y <= Math.ceil(Y + oy + h); y++) for (let x = Math.floor(X + ox); x <= Math.ceil(X + ox + w); x++) {
          if (x < 0 || y < 0 || x >= W || y >= H || !inDisc(x - ox, y - oy, X, Y, w, h)) continue;
          sample((y * W + x) * 4, x - ox, y - oy);
        }
      });
    } else if (R.role === 'slide') {
      // a piece on a board (a tile in a lattice) slides one cell over, holds, and slides back; the cell it leaves shows
      // what the card has in the empty cell it moves to (the lattice's own lines and grain), so nothing is refilled
      const [mx, my] = R.move, k0 = (C.regions.indexOf(R) % 4) * 0.22;
      const k = EASE.smooth(P(t, 0.7 + k0, 0.55)) * (1 - EASE.smooth(P(t, 2.5 + k0, 0.55)));
      if (k < 1e-4) continue;
      const ink = hexRgb(R.ink).split(',').map(Number);
      const alpha = (x, y) => { if (x < bx || y < by || x >= bx + bw || y >= by + bh) return 0;
        const p = (Math.round(y) * W + Math.round(x)) * 4, d = Math.hypot(s[p] - ink[0], s[p + 1] - ink[1], s[p + 2] - ink[2]);
        return clamp((190 - d) / 50); };  // its anti-aliased rim goes with it, or a coloured outline stays in the cell
      const ox = mx * k, oy = my * k;
      const x0 = Math.max(0, Math.min(bx, bx + Math.floor(mx)) - 2), x1 = Math.min(W - 1, Math.max(bx + bw, bx + bw + Math.ceil(mx)) + 2);
      const y0 = Math.max(0, Math.min(by, by + Math.floor(my)) - 2), y1 = Math.min(H - 1, Math.max(by + bh, by + bh + Math.ceil(my)) + 2);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const q = (y * W + x) * 4, a0 = alpha(x, y), a1 = alpha(x - ox, y - oy);
        if (a0 <= 0 && a1 <= 0) continue;
        const bg = [0, 0, 0];
        if (a0 > 0) { sample(q, x + mx, y + my); for (let c = 0; c < 3; c++) bg[c] = o[q + c]; }  // all of its cell, rim included, is the empty cell's
        else for (let c = 0; c < 3; c++) bg[c] = s[q + c];
        if (a1 > 0) { sample(q, x - ox, y - oy); for (let c = 0; c < 3; c++) o[q + c] = o[q + c] * a1 + bg[c] * (1 - a1); }
        else for (let c = 0; c < 3; c++) o[q + c] = bg[c];
      }
    } else if (R.role === 'marquee') {
      if (R.pitch && !R._whole) {  // where the whole logos start and end: the gaps between logos, found on the card
        const paper = hexRgb(C.paper || '#000000').split(',').map(Number);
        const gapAt = x => { let d = 0; for (let y = by; y < by + bh; y++) { const p = (y * W + bx + x) * 4; d += Math.abs(s[p] - paper[0]) + Math.abs(s[p + 1] - paper[1]) + Math.abs(s[p + 2] - paper[2]); } return d; };
        let g = 0, best = 1e18;
        for (let x = 0; x < Math.min(bw, Math.ceil(R.pitch)); x++) { const d = gapAt(x); if (d < best) { best = d; g = x; } }
        const n = Math.floor((bw - g) / R.pitch);
        R._whole = [g, g + n * R.pitch];
      }
      const sh = (R.shift || 70) * ENERGY.idle * Math.sin(w2) * (R.dir || 1);
      if (Math.abs(sh) < 1e-3) continue;
      for (let y = Math.max(0, by); y < Math.min(H, by + bh); y++) for (let x = Math.max(0, bx); x < Math.min(W, bx + bw); x++) {
        // with the reading's logo pitch, the row is a loop of its whole logos: what comes in at an edge is a whole logo
        // from the other end, never the half one the card's edge cuts (that one fades out as the row starts to move, so frame 0 is the
        // card); without a pitch the row wraps around its own width
        let sx = x - bx - sh;
        if (R.pitch) {
          const [g0, g1] = R._whole;
          // the row is a loop of its whole logos: what leaves at one end comes back at the other
          const span = g1 - g0;
          let wx = sx;
          while (wx < g0) wx += span;
          while (wx > g1 - 1.001) wx -= span;
          const q = (y * W + x) * 4;
          if (wx === sx) { sample(q, bx + sx, y); continue; }
          const k = Math.min(1, Math.abs(sh) / 24);
          sample(q, bx + wx, y);
          if (k < 1) { const c0 = [o[q], o[q + 1], o[q + 2]]; sample(q, bx + Math.max(0, Math.min(bw - 1.001, sx)), y);
            for (let c = 0; c < 3; c++) o[q + c] = o[q + c] * (1 - k) + c0[c] * k; }
          continue;
        }
        sx = ((sx % bw) + bw) % bw;
        sample((y * W + x) * 4, bx + Math.min(bw - 1.001, sx), y);
      }
    }
  }
  ctx.putImageData(out, 0, 0);
}
// a globe in the background (suggest_layers.py "sphere": x, y, r) turns about its axis and back: each row is resampled
// through the sphere, so the land slides around the curve; the turn fades out toward the limb, where what flies above
// the globe (arcs, a glow) joins what lies outside it
function sphereFrame(t) {
  const { ctx, src, whole, out } = TEX, [cx, cy, r] = C.sphere, th = 0.3 * ENERGY.idle * env(t);
  if (Math.abs(th) < 1e-4) { ctx.putImageData(src, 0, 0); return; }
  const s = (whole || src).data, o = out.data;
  o.set(src.data);
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(W - 1, Math.ceil(cx + r));

      const px = out > 0 ? tx + (ex - tx) * out : sx + (tx - sx) * inn - 40 * Math.sin(Math.PI * inn);
      const py = out > 0 ? ty + (ey - ty) * out - 30 * Math.sin(Math.PI * out) : sy + (ty - sy) * inn;
      const vis = on && t > a && t < a + 2.1 ? Math.min(1, (t - a) / 0.12, (a + 2.1 - t) / 0.15) : 0;
      const click = 1 - 0.14 * bump(t, a + 0.95, 0.2);
      l.cursor.style.opacity = vis.toFixed(4);
      l.cursor.style.transform = `translate(${(px - 6).toFixed(2)}px,${(py - 4).toFixed(2)}px) scale(${click.toFixed(4)})`;
      const q = P(t, a + 1.0, 0.75), rr = Math.max(l.w, l.h) * 0.85 * EASE.out(q);
      l.ripple.style.opacity = on && q > 0 && q < 1 ? (1 - q).toFixed(4) : 0;
      l.ripple.style.background = `radial-gradient(circle at ${(tx - l.x).toFixed(1)}px ${(ty - l.y).toFixed(1)}px, rgba(${l.rippleC},.05) ${(rr * 0.72).toFixed(1)}px, rgba(${l.rippleC},.13) ${(rr * 0.93).toFixed(1)}px, rgba(${l.rippleC},0) ${rr.toFixed(1)}px)`;
    }
    if (l.glint) {  // opens, turns a quarter and closes: after the hop or the pop, or by itself
      const q = P(t, fa + (l.fx === 'hop' ? 0.3 : l.turn === 'pop' ? 0.12 : 0), 0.7), v = q > 0 && q < 1 && on ? Math.sin(Math.PI * q) : 0;
      l.glint.style.opacity = v.toFixed(4);
      l.glint.style.transform = `scale(${v.toFixed(4)}) rotate(${(90 * q).toFixed(2)}deg)`;
    }
    if (l.orbit) {
      const q = P(t, fa, 1.1), v = q > 0 && q < 1 && on ? Math.sin(Math.PI * q) : 0, c = l.orbitC;
      l.orbit.style.opacity = (0.9 * v).toFixed(4);
      l.orbit.style.background = `conic-gradient(from ${(360 * EASE.inOut(q) - 60).toFixed(1)}deg, rgba(${c},0) 0deg, rgba(${c},.85) 30deg, rgba(${c},0) 70deg, rgba(${c},0) 360deg)`;
    }
    if (l.ring) {
      const a = living ? l.at + 0.3 : l.at + 0.22, rp = P(t, a, 0.75);
      l.ring.style.opacity = rp > 0 && rp < 1 && ENERGY.accents >= 1 ? 0.9 * (1 - rp) : 0;
      l.ring.style.transform = `scale(${1 + 0.55 * EASE.out(rp)})`;
    }
  });

  extras.forEach(x => {
    if (x.type === 'shine') {  // swells twice, gently, and is gone at both ends of the loop
      const v = 0.75 * (bump(t, 0.7, 1.1) + 0.8 * bump(t, 2.2, 1.2));
      x.el.style.opacity = v.toFixed(4); x.el.style.transform = `scale(${(0.85 + 0.25 * v).toFixed(4)})`;
      return;
    }
    if (x.type === 'glow') {
      const E = env(t), dx = 50 * Math.sin(2 * Math.PI * t / T + x.k * 2), dy = 30 * Math.cos(2 * Math.PI * t / T * 2 + x.k);
      x.el.style.left = x.x - x.r + dx + 'px'; x.el.style.top = x.y - x.r + dy + 'px'; x.el.style.opacity = x.o * E;
    } else {
      const p = P(t, x.at, 0.7);
      if (p <= 0 || p >= 1) { x.el.style.opacity = 0; return; }
      const d = x.d * EASE.out(p);
      x.el.style.opacity = p < 0.15 ? p / 0.15 : 1 - away((p - 0.15) / 0.85);
      x.el.style.transform = `translate(${Math.cos(x.a) * d}px,${Math.sin(x.a) * d}px) rotate(${180 * p}deg) scale(${1 - 0.6 * p})`;
    }
  });
  const hl = layers.find(l => l.hero);
  if (hl) {
    const on = EASE.smooth(P(t, hl.at + 0.35, 0.8)) * (1 - EASE.smooth(P(t, T - 0.55, 0.5)));  // zero at both ends
    hl.halo.style.opacity = (on * (0.85 + 0.15 * Math.sin(2 * Math.PI * t / T * 2))).toFixed(4);
  }
};

// ?play previews the loop in a browser; reduced motion shows the still card
if (/[?&]play\b/.test(location.search)) window.ready.then(() => {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const t0 = performance.now(); const tick = now => { window.render((now - t0) / 1000); requestAnimationFrame(tick); }; requestAnimationFrame(tick);
});
</script>
</body></html>
