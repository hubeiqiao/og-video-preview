<!doctype html>
<!-- The landing page's og:video, route B: one still becomes many moving previews.
     A beam of white light passes through a thick glass link card and splits into a fan of spectral cards; each one
     plays a real og:video tinted by its colour. The fan breathes open and closed, light ripples through it, dust drifts
     in the beam. Every motion is periodic in the 4 s loop, so it closes on itself. Visual first: no headline. -->
<html><head><meta charset="utf-8">
<script>window.OG = { width: 1200, height: 630 };</script>
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #050404; }
canvas { display: block; width: 1200px !important; height: 630px !important; }
video { display: none; }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1200, H = 630, T = 4, TAU = Math.PI * 2;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#060505');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;
scene.environmentIntensity = 0.25;

const camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 80);
camera.position.set(-0.2, 1.1, 6.0);
camera.lookAt(0.05, 0.82, -0.7);

// a black floor that keeps a soft reflection of the light
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#040303', roughness: 0.62, metalness: 0.0, envMapIntensity: 0.2 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

// the glass card the light passes through
const glass = new THREE.Mesh(new RoundedBoxGeometry(1.25, 0.72, 0.16, 6, 0.06), new THREE.MeshPhysicalMaterial({
  color: '#ffffff', metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.6, ior: 1.5, dispersion: 4, iridescence: 0.25,
  clearcoat: 1, attenuationColor: '#fff6e8', attenuationDistance: 3, specularIntensity: 1, envMapIntensity: 1.6 }));
glass.position.set(-1.75, 0.8, 0); glass.rotation.y = 0.62; scene.add(glass);
const rim = new THREE.PointLight('#ffffff', 3, 3, 2); rim.position.set(-1.9, 1.4, 1.2); scene.add(rim);

// the beam: a soft additive shaft of white light from the left into the glass
const shaftMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false,
  uniforms: { t: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `varying vec2 vUv; uniform float t;
    void main(){ float core = exp(-pow((vUv.y - 0.5) / 0.07, 2.0)); float halo = exp(-pow((vUv.y - 0.5) / 0.26, 2.0)) * 0.25;
      float along = smoothstep(0.0, 0.35, vUv.x) * (0.8 + 0.2 * sin(6.2831 * (vUv.x * 2.0 - t)));
      gl_FragColor = vec4(vec3(1.0, 0.97, 0.92) * (core * 1.25 + halo * 0.6) * along, 1.0); }` });
const shaft = new THREE.Mesh(new THREE.PlaneGeometry(6, 0.9), shaftMat);
shaft.position.set(-4.75, 0.8, -0.05); shaft.rotation.z = -0.03; scene.add(shaft);

// where the white light strikes the glass, and where the colours leave it
function glowTex() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const r = g.createRadialGradient(64, 64, 0, 64, 64, 64); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.2, 'rgba(255,245,230,0.55)'); r.addColorStop(1, 'rgba(255,240,220,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const glareMat = new THREE.SpriteMaterial({ map: glowTex(), color: new THREE.Color(2.6, 2.5, 2.3), transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: false });
const hit = new THREE.Sprite(glareMat); hit.position.set(-2.12, 0.8, 0.45); hit.scale.set(0.42, 0.42, 1); hit.renderOrder = 30; scene.add(hit);
const exit = new THREE.Sprite(glareMat.clone()); exit.position.set(-1.38, 0.8, 0.2); exit.scale.set(0.34, 0.34, 1); exit.renderOrder = 30; scene.add(exit);
const rayMat = hex => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide,
  uniforms: { tint: { value: new THREE.Color(hex) }, pulse: { value: 1 }, ph: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform vec3 tint; uniform float pulse; uniform float ph; varying vec2 vUv;
    void main(){ float core = exp(-pow((vUv.y - 0.5) / 0.12, 2.0)); float halo = exp(-pow((vUv.y - 0.5) / 0.4, 2.0)) * 0.25;
      float fade = smoothstep(0.0, 0.08, vUv.x) * (1.0 - 0.55 * vUv.x);
      float travel = 0.65 + 0.35 * sin(6.2831 * (vUv.x * 1.5 - ph));
      gl_FragColor = vec4(tint * (core * 1.5 + halo) * fade * travel * pulse, 1.0); }` });
const X = new THREE.Vector3(1, 0, 0);
function aim(mesh, a, b, width) {  // a flat ray from a to b
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5); mesh.scale.set(len, width, 1);
  mesh.quaternion.setFromUnitVectors(X, d.normalize());
}

// the spectrum: cards fanned out behind the glass, each a real og:video in its colour
const SPECTRUM = ['#ff4b3e', '#ff9f1c', '#ffe14d', '#3ddc84', '#2ec5ff', '#7b61ff'];
const SRC = ['stripe', 'linear', 'vercel', 'figma', 'framer', 'spotify'];
const vert = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }';
const frag = `uniform sampler2D map; uniform vec3 tint; uniform float glow; uniform float wave; varying vec2 vUv;
  float rbox(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
  void main(){
    float d = rbox((vUv - 0.5) * vec2(1.905, 1.0), vec2(0.9525, 0.5), 0.05);
    float a = 1.0 - smoothstep(-0.006, 0.0, d);
    vec3 v = texture2D(map, vUv).rgb;
    float l = dot(v, vec3(0.2126, 0.7152, 0.0722));
    vec3 c = mix(v * 0.8, tint * (0.12 + 0.95 * l), 0.42);          // the video, dyed by its band of the spectrum
    float edge = 1.0 - smoothstep(0.0, 0.016, -d);
    float sweep = exp(-pow((vUv.x - wave) / 0.06, 2.0));
    c += tint * (edge * 1.1 + sweep * 0.45) * glow;
    gl_FragColor = vec4(c, a * 0.94);
    #include <colorspace_fragment>
  }`;
function videoTex(src) {
  const v = document.createElement('video'); Object.assign(v, { src, muted: true, playsInline: true, preload: 'auto' }); document.body.appendChild(v);
  const t = new THREE.VideoTexture(v); t.colorSpace = THREE.SRGBColorSpace; return { v, t };
}
const cards = SPECTRUM.map((hex, i) => {
  const { v, t } = videoTex(`media/${SRC[i]}.mp4`);
  const uni = { map: { value: t }, tint: { value: new THREE.Color(hex) }, glow: { value: 1 }, wave: { value: 0 } };
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.905, 1), new THREE.ShaderMaterial({ uniforms: uni, vertexShader: vert, fragmentShader: frag, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  m.renderOrder = 10 - i; scene.add(m);
  const light = new THREE.PointLight(hex, 0.45, 2.4, 1.4); scene.add(light);   // each colour spills onto the floor
  const ray = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), rayMat(hex)); ray.renderOrder = 20; scene.add(ray);
  return { m, v, uni, i, light, ray };
});

// dust in the beam, drifting with the light; each mote returns to its start at the loop
const N = 260, dust = new Float32Array(N * 3), seed = [];
for (let i = 0; i < N; i++) seed.push([Math.random(), Math.random(), Math.random(), Math.random()]);
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dust, 3));
const dustMat = new THREE.PointsMaterial({ color: '#fff2dc', size: 0.022, transparent: true, opacity: 0.85, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
scene.add(new THREE.Points(dustGeo, dustMat));

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.55, 0.35, 0.82));
composer.addPass(new OutputPass());

const seek = (v, time) => new Promise(r => { if (Math.abs(v.currentTime - time) < 1e-4) return r(); v.addEventListener('seeked', () => r(), { once: true }); v.currentTime = time; });
window.render = async function (t) {
  t = ((t % T) + T) % T; const ph = t / T;
  shaftMat.uniforms.t.value = ph;
  const open = 0.5 - 0.5 * Math.cos(TAU * ph);                       // the fan opens and closes once per loop, starting closed-ish
  await Promise.all(cards.map(c => {
    const k = c.i, f = k / (SPECTRUM.length - 1);
    const spread = 0.55 + 0.45 * (1 - open);
    const x = 0.15 + k * 0.78 * spread, y = 0.86 + (f - 0.5) * 0.3 * spread, z = -0.2 - k * 0.55;
    c.m.position.set(x, y, z);
    c.m.rotation.set(0.04 * Math.sin(TAU * (ph + f * 0.3)), -0.58 + 0.05 * Math.sin(TAU * (ph + f * 0.5)), (f - 0.5) * 0.14 * spread);
    c.light.position.set(x, 0.12, z + 0.6);
    c.uni.wave.value = ((ph * 1.0 + f * 0.18) % 1) * 1.4 - 0.2;    // a ripple of light runs through the fan
    c.uni.glow.value = 0.7 + 0.3 * Math.sin(TAU * (ph - f * 0.35));
    aim(c.ray, exit.position, new THREE.Vector3(x - 0.86, y + (f - 0.5) * 0.85, z), 0.07);   // the rays fan out to each card's near edge
    c.ray.material.uniforms.ph.value = ph + f * 0.2;
    c.ray.material.uniforms.pulse.value = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(TAU * (ph - f * 0.3)));
    return seek(c.v, (t + k * 0.6) % T);
  }));
  for (let i = 0; i < N; i++) {                                      // motes move along the beam and wrap exactly once per loop
    const [a, b, c, d] = seed[i]; const u = (a + ph) % 1;
    dust[i * 3] = -6.5 + u * 5.2; dust[i * 3 + 1] = 0.8 + (b - 0.5) * 0.7 + 0.04 * Math.sin(TAU * (ph * 2 + d));
    dust[i * 3 + 2] = (c - 0.5) * 0.9;
  }
  dustGeo.attributes.position.needsUpdate = true;
  cards.forEach(c => { c.uni.map.value.needsUpdate = true; });
  glass.rotation.y = 0.62 + 0.05 * Math.sin(TAU * ph);
  hit.material.opacity = 0.85 + 0.15 * Math.sin(TAU * ph * 2);
  composer.render();
};
const loaded = v => new Promise(r => v.readyState >= 2 ? r() : v.addEventListener('loadeddata', r, { once: true }));
window.ready = Promise.all(cards.map(c => loaded(c.v))).then(() => window.render(0)).then(() => { window.readyDone = true; });
</script>
</body></html>
